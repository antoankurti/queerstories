<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant brief — I knew you existed</title>
    <!-- page volontairement non indexée -->
    <meta name="robots" content="noindex, nofollow">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14161a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IKYE">
    <link rel="apple-touch-icon" href="media/icons/icon-apple.png">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/nav.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <!-- liens injectés par js/nav.js — données : data/nav.json -->
        </nav>
    </header>

    <main class="written-content" id="brief-content">
        <!-- contenu injecté par js/brief.js depuis data/brief.json -->
    </main>

    <!-- hr + copyright injectés par js/nav.js -->
    <footer></footer>

    <!-- QR code desktop -->
    <div id="desktop-hint">
        <div class="pwa-frame">
            <div id="desktop-hint-qr"></div>
            <p class="pwa-title">Open on your phone.</p>
            <p class="pwa-subtitle">Scan to install — made for mobile.</p>
            <button id="desktop-hint-close">✕</button>
        </div>
    </div>

    <!-- Hint iOS -->
    <div id="pwa-hint">
        <div class="pwa-frame">
            <p class="pwa-title">This website is best viewed as an app.</p>
            <p class="pwa-subtitle">Tap the button below, then choose "Add to Home Screen".</p>
            <button id="pwa-share">Add to screen</button>
            <button id="pwa-hint-close">✕</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/pwa.js" defer></script>
    <script src="js/brief.js" defer></script>
    <div id="brief-qr" class="brief-qr" aria-hidden="true"></div>
</body>

</html>
