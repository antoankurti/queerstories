<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Loading...</title>
    <meta name="description" content="">
    <meta name="author" content="Antoan Kurti">

    <!-- Open Graph — remplis dynamiquement par city.js -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="I knew you existed">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14161a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IKYE">
    <link rel="apple-touch-icon" href="media/icons/icon-apple.png">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="city-page">

    <!-- Header identique à l'index — nav.js injecte les liens, CSS masque tout sauf "cities" -->
    <header>
        <nav></nav>
    </header>

    <!-- Contenu de la ville — généré dynamiquement depuis data/{ville}.json par js/city.js -->
    <main class="media-content" id="city-content"></main>

    <footer style="display:none"></footer>

    <!-- Message desktop — QR code pour installer sur téléphone -->
    <div id="desktop-hint">
        <div class="pwa-frame">
            <div id="desktop-hint-qr"></div>
            <p class="pwa-title">Open on your phone.</p>
            <p class="pwa-subtitle">Scan to install — made for mobile.</p>
            <button id="desktop-hint-close">✕</button>
        </div>
    </div>

    <!-- Hint d'installation pour iOS -->
    <div id="pwa-hint">
        <div class="pwa-frame">
            <p class="pwa-title">This website is best viewed as an app.</p>
            <p class="pwa-subtitle">Tap the button below, then choose "Add to Home Screen".</p>
            <button id="pwa-share">Add to screen</button>
            <button id="pwa-hint-close">✕</button>
        </div>
    </div>


    <!-- Scripts -->
    <script src="js/nav.js" defer></script>
    <script src="js/city.js" defer></script>
    <script src="js/pwa.js" defer></script>

</body>

</html>
